name: Validate public source and release guards

on:
  push:
    branches: [main, 'experiment/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Reject private payloads and stale runtime sources
        run: python3 tools/check_release_repository.py
      - name: Test packaging and publication guards
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Test embedded startup configuration recovery
        run: python3 tools/test_startup_config.py
      - name: Download approved runtime for package rehearsal
        if: github.event_name == 'push'
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_ci.py fetch --output .cache/release
      - name: Rehearse complete packaging without publishing a release
        if: github.event_name == 'push'
        env:
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.runtime_path }}
          PACKAGE_COMMIT: ${{ github.sha }}
        run: |
          PACKAGE_VERSION="v$(python3 -c 'import json; print(json.load(open("release/runtime-lock.json"))["runtime_version"].split("-")[0])')-ci${{ github.run_number }}"
          export PACKAGE_VERSION
          python3 tools/release_package.py --runtime "$RUNTIME_ARCHIVE" \
            --output dist/ci --version "$PACKAGE_VERSION" --commit "$PACKAGE_COMMIT"
          python3 -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"tools"); from release_ci import validate_assets; validate_assets(Path("dist/ci"),os.environ["PACKAGE_VERSION"],os.environ["PACKAGE_COMMIT"])'
      - name: Retain verified package rehearsal
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sleepingdogs-production-ci-${{ github.run_number }}
          path: dist/ci/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
