name: Sleeping Dogs package and release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Validate complete SD package
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Only reviewed code already merged into main is checked out.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Check repository and pinned source inputs
        run: python3 tools/check_release_repository.py
      - name: Test package and release guards
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Test embedded startup configuration recovery
        run: python3 tools/test_startup_config.py
      - name: Set package version
        id: version
        run: python3 tools/release_ci.py version
      - name: Download approved production runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_ci.py fetch --output .cache/release
      - name: Assemble and verify NRO, NSP and SD layout
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_COMMIT: ${{ steps.version.outputs.commit }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.runtime_path }}
        run: |
          python3 tools/release_package.py \
            --runtime "$RUNTIME_ARCHIVE" \
            --output dist/release \
            --version "$PACKAGE_VERSION" \
            --commit "$PACKAGE_COMMIT"
      - name: Upload downloadable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SleepingDogs-FEXTendo-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tag and release
    needs: package
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: sleepingdogs-release-${{ github.repository }}-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.package.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SleepingDogs-FEXTendo-${{ needs.package.outputs.version }}
          path: dist/release
      - name: Publish verified assets with automatic changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.version }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: python3 tools/release_ci.py publish --input dist/release --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
